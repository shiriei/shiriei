name: Generate Contribution Network

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate Contribution Network
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_network.py

      - name: Publish to output branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Backup the generated file outside the repository
          cp output/contribution-network.svg /tmp/contribution-network.svg
          
          # Switch to an empty orphan branch
          git checkout --orphan output
          
          # Remove all files from the index and working tree
          git rm -rf .
          git clean -fdx
          
          # Restore the SVG directly at the root of the output branch
          cp /tmp/contribution-network.svg contribution-network.svg
          # Add, commit, and force-push to keep the branch clean
          git add contribution-network.svg
          git commit -m "chore: automate contribution network generation" || exit 0
          git push origin output --force
